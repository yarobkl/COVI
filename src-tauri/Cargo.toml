[package]
name = "covi"
version = "0.1.0"
description = "COVI - Le système d'exploitation de votre commerce"
authors = ["YaroConsulting"]
edition = "2021"

[lib]
name = "covi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.12.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
