workflows:
  ios-simulator:
    name: COVI iOS Simulator
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web application
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build simulator app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app

  ios-app-store:
    name: COVI iOS App Store
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      groups:
        - app_store_connect
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yaroconsulting.covi
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web application
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
