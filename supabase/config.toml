# Inscription locale / préproduction : lien obligatoire avant ouverture de session.
# IMPORTANT : ces options CLI ne modifient PAS le réglage Auth hébergé du Dashboard.
[auth.email]
enable_confirmations = true

[auth.email.template.confirmation]
subject = "COVI — Confirmez votre compte et démarrez votre activité"
content_path = "./supabase/templates/confirmation.html"

# Canal client : fonction publique au niveau HTTP. La passerelle contrôle elle-même l'origine,
# Turnstile, les quotas et chaque champ (voir supabase/functions/public-checkout).
[functions.public-checkout]
verify_jwt = false

# Paiement Mobile Money (OpenPay) : le callback d'OpenPay n'a pas de JWT. La fonction vérifie
# elle-même la session de la boutique (actions request / refresh) et relit tout statut chez OpenPay.
[functions.openpay]
verify_jwt = false

# Purge nocturne des comptes supprimés : appelée par pg_cron avec son propre jeton (Vault).
[functions.account-purge]
verify_jwt = false

# Restaurant : QR d'une table, catalogue et statut uniquement. Accès public en lecture,
# strictement via la fonction Edge, désactivée par défaut jusqu'à validation.
[functions.restaurant-qr]
verify_jwt = false

# Paniers collectifs : fonction invitée sécurisée, jamais de JWT direct au client.
# Elle ne peut fonctionner qu'avec Turnstile, secret HMAC et activation explicite.
[functions.restaurant-guest]
verify_jwt = false

# Push Cuisine : seul un ordonnanceur serveur muni du secret peut exécuter
# les envois. La passerelle contrôle son propre bearer avant toute lecture.
[functions.restaurant-kitchen-push]
verify_jwt = false
