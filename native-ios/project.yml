name: COVI
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  COVI:
    type: application
    platform: iOS
    sources:
      - path: COVI
        excludes: ["README.md"]
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/COVI.entitlements
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          COVI_CLOUD_ENVIRONMENT: Development
        Release:
          COVI_CLOUD_ENVIRONMENT: Production
  COVITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: COVITests
    dependencies:
      - target: COVI
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  COVIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: COVIUITests
    dependencies:
      - target: COVI
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: COVI
        CODE_SIGNING_ALLOWED: NO
schemes:
  COVI:
    build:
      targets:
        COVI: all
    test:
      targets:
        - COVITests
    archive:
      config: Release
  COVIInteraction:
    build:
      targets:
        COVI: all
    test:
      config: Debug
      targets:
        - COVIUITests
