name: COVI
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  COVI:
    type: application
    platform: iOS
    sources:
      - path: COVI
        excludes: ["README.md"]
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/COVI.entitlements
        INFOPLIST_FILE: Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  COVI:
    build:
      targets:
        COVI: all
    archive:
      config: Release
