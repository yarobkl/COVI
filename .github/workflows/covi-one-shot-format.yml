name: One-shot COVI cashier formatting
on:
  push:
    branches: [claude/caisse-multi-caissiers]

permissions:
  contents: write

jobs:
  prettier:
    # This job is intentionally one-time; delete the workflow after it finishes.
    if: "${{ github.event.head_commit.message == 'chore(caisse): one-shot Prettier formatting' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/caisse-multi-caissiers
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Format only three reviewed files
        run: npx prettier --write src/features/sale/cartRecovery.ts src/features/sale/cartRecovery.test.ts src/features/sale/SalePage.tsx
      - name: Commit formatting to the same feature branch only
        run: |
          git config user.name 'COVI formatting bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/sale/cartRecovery.ts src/features/sale/cartRecovery.test.ts src/features/sale/SalePage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(caisse): apply project Prettier to recovery patch'
            git push origin HEAD:claude/caisse-multi-caissiers
          fi
