name: COVI audit document formatting only
on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
    paths:
      - '.github/workflows/covi-audit-document-format.yml'
permissions:
  contents: write
jobs:
  format-audit:
    if: github.repository == 'yarobkl/COVI' && github.ref == 'refs/heads/feature/covi-stock-central-omnichannel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the security review note
        run: npx prettier --write docs/pre-integration-security-audit-2026-10-18.md
      - name: Verify formatting
        run: npm run format:check
      - name: Commit on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/pre-integration-security-audit-2026-10-18.md
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(security): format audit note without changing application'
            git push origin HEAD:refs/heads/feature/covi-stock-central-omnichannel
          fi
