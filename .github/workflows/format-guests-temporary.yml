name: Format guest basket draft (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/lib/restaurantGuests.ts src/features/restaurant/RestaurantGuestBasket.tsx src/features/restaurant/RestaurantOrdersPage.tsx src/features/restaurant/PublicRestaurantTablePage.tsx src/features/orders/TurnstileChallenge.tsx tests/restaurant-guest-gateway.test.mjs supabase/functions/restaurant-guest/gateway.mjs supabase/functions/restaurant-guest/index.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ tests/restaurant-guest-gateway.test.mjs supabase/functions/restaurant-guest/
          if ! git diff --cached --quiet; then
            git commit -m "style: normaliser le parcours invités multi-téléphones"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
