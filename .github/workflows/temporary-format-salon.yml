name: Format salon integration (temporary)
on:
  push:
    branches:
      - feature/covi-salon-opening-20261023
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[salon format bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/auth/CreateShopForm.tsx src/features/salon/SalonBookingsPage.tsx
      - run: |
          if ! git diff --quiet; then
            git config user.name "COVI format bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/auth/CreateShopForm.tsx src/features/salon/SalonBookingsPage.tsx
            git commit -m "style(salon): apply Prettier [salon format bot]"
            git push origin HEAD:feature/covi-salon-opening-20261023
          fi
