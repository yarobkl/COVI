name: COVI one-shot security hardening formatter
on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
    paths:
      - '.github/workflows/covi-security-hardening-format.yml'
permissions:
  contents: write
jobs:
  format-security-changes:
    if: github.repository == 'yarobkl/COVI' && github.ref == 'refs/heads/feature/covi-stock-central-omnichannel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the three reviewed security files
        run: |
          npx prettier --write \
            src/lib/checkoutFeatureFlag.ts \
            src/lib/checkoutFeatureFlag.test.ts \
            tests/public-checkout-gateway.test.mjs
      - name: Verify before any commit
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Commit formatting strictly to experimental branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/lib/checkoutFeatureFlag.ts \
            src/lib/checkoutFeatureFlag.test.ts \
            tests/public-checkout-gateway.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatting changes'
          else
            git commit -m 'style(security): format gateway and checkout isolation hardening'
            git push origin HEAD:refs/heads/feature/covi-stock-central-omnichannel
          fi
