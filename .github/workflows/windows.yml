name: COVI Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm list --depth=0
      - run: npm run build
  build-windows:
    needs: test-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm install
      - name: Generate temporary Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(8,40,61))
          $font = New-Object System.Drawing.Font('Arial',110,[System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(246,163,19))
          $g.DrawString('C',$font,$brush,55,55)
          $icon=[System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $fs=New-Object System.IO.FileStream('src-tauri/icons/icon.ico',[System.IO.FileMode]::Create)
          $icon.Save($fs); $fs.Close(); $g.Dispose(); $bmp.Dispose()
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: COVI-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
