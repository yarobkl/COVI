name: Format multisector live-base draft (temporary)
on:
  push:
    branches:
      - feature/covi-multisector-live-base
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-multisector-live-base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write docs/PLAN-COVI-MULTISECTOR-2026-10-17.md src/app/App.test.tsx src/app/App.tsx src/app/navigation.ts src/app/routes.ts src/features/auth/AuthGate.tsx src/features/auth/CreateShopForm.tsx src/features/settings/SettingsPage.tsx src/features/staff/EmployeesPage.tsx src/lib/database.types.ts src/lib/types.ts src/lib/businessKinds.ts src/lib/businessKinds.test.ts src/features/staff/salaryMath.ts src/features/staff/salaryMath.test.ts src/components/icons/index.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN-COVI-MULTISECTOR-2026-10-17.md src/
          if ! git diff --cached --quiet; then
            git commit -m "style: format multisector live-base branch"
            git push origin HEAD:feature/covi-multisector-live-base
          fi
