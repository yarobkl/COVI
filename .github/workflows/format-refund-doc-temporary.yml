name: Format restaurant refund document (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write docs/IMPLEMENTATION-RESTAURANT-REMBOURSEMENTS-LOT-6.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION-RESTAURANT-REMBOURSEMENTS-LOT-6.md
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): normaliser les remboursements espèces"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
