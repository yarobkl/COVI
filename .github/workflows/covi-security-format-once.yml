name: COVI security patch formatting
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/covi-security-format-once.yml'

permissions:
  contents: write

jobs:
  format-gateway-only:
    if: ${{ github.event.pull_request.head.repo.full_name == 'yarobkl/COVI' && github.head_ref == 'feature/covi-stock-central-omnichannel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-stock-central-omnichannel
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the two security patch files
        run: npx prettier --write src/lib/publicOrders.ts src/lib/publicOrders.test.ts
      - name: Commit only formatter changes to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/lib/publicOrders.ts src/lib/publicOrders.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(security): format safe gateway endpoint checks'
            git push origin HEAD:refs/heads/feature/covi-stock-central-omnichannel
          fi
