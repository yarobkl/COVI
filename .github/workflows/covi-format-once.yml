name: COVI format shared cashier changes (one shot)
on:
  push:
    branches:
      - claude/caisse-multi-caissiers
    paths:
      - .github/workflows/covi-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed cashier files
        run: |
          npx prettier --write src/features/history/HistoryPage.tsx src/features/history/sellerTotals.ts src/features/team/CounterApp.tsx src/features/team/SharedCashiersPanel.tsx src/features/team/TillSwitch.tsx src/lib/sharedCashiers.ts src/lib/types.ts
          git diff --stat
      - name: Save formatted code to the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/history/HistoryPage.tsx src/features/history/sellerTotals.ts src/features/team/CounterApp.tsx src/features/team/SharedCashiersPanel.tsx src/features/team/TillSwitch.tsx src/lib/sharedCashiers.ts src/lib/types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(caisse): format shared PIN cashier integration"
            git push origin HEAD:claude/caisse-multi-caissiers
          fi
