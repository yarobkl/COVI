name: COVI quartier one-time formatting
on:
  push:
    branches:
      - feat/covi-neighborhood-onboarding
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/covi-neighborhood-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format quartier feature with pinned Prettier
        run: |
          npx --no-install prettier --write \
            src/features/auth/CreateShopForm.tsx \
            src/features/locations/NeighborhoodFields.test.tsx \
            src/features/locations/ShopGpsControl.tsx \
            src/features/settings/SettingsPage.tsx \
            src/lib/neighborhoods.test.ts
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/CreateShopForm.tsx src/features/locations/NeighborhoodFields.test.tsx src/features/locations/ShopGpsControl.tsx src/features/settings/SettingsPage.tsx src/lib/neighborhoods.test.ts
          git commit -m "style(onboarding): apply repository formatting to quartiers and GPS"
          git push origin HEAD:feat/covi-neighborhood-onboarding
