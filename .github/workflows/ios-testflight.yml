name: COVI iOS - TestFlight (manual, signed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public iOS version (example 1.0.0)'
        required: true
        default: '1.0.0'
      buildNumber:
        description: 'Unique, increasing App Store Connect build number'
        required: true
        default: '1'
      uploadToTestFlight:
        description: 'Explicitly sign and upload this build to TestFlight'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: covi-ios-testflight
  cancel-in-progress: false

jobs:
  distribute:
    # No credentials are accessed or upload performed without the explicit dispatch opt-in.
    if: ${{ inputs.uploadToTestFlight == true }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_BUNDLE_ID: com.covi.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-ios-capacitor
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify authorization and signing secrets
        run: |
          set -eu
          for value in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY CERTIFICATE_P12 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [ -z "${!value}" ]; then
              echo "::error::Required GitHub Actions secret missing: $value"
              exit 1
            fi
          done
          test "$APPLE_TEAM_ID" = "UK4UQCQ57G" || {
            echo "::error::Configured Apple Team ID does not match the COVI project owner."
            exit 1
          }
          grep -q 'com.covi.app' capacitor.config.json
          test -d ios/App
      - name: Prepare locked iOS application
        run: |
          npm ci
          npm run ios:sync
      - name: Set Apple export compliance automatically
        run: |
          set -eu
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")" = "false"
      - name: Install final COVI app icons and beige splash
        run: |
          swift scripts/ios/make-covi-icon.swift ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          DIR=ios/App/App/Assets.xcassets/Splash.imageset
          swift scripts/ios/make-covi-splash.swift "$DIR/splash-2732x2732.png"
          cp "$DIR/splash-2732x2732.png" "$DIR/splash-2732x2732-1.png"
          cp "$DIR/splash-2732x2732.png" "$DIR/splash-2732x2732-2.png"
      - name: Set iOS version and build
        env:
          MARKETING_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $MARKETING_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      - name: Install and verify provision profile
        run: |
          set -eu
          PROFILE="$RUNNER_TEMP/COVI.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/COVI-profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/COVI-profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/COVI-profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/COVI-profile.plist")
          test "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$APP_BUNDLE_ID" || {
            echo "::error::Wrong provisioning profile for COVI bundle ID."
            exit 1
          }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "COVI_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Install App Store Connect private key securely
        run: |
          set -eu
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$ASC_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY"
          fi
          chmod 600 "$KEY"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY"
      - name: Archive signed app
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/COVI.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$COVI_PROFILE_NAME"
      - name: Export signed IPA
        run: |
          OPTIONS="$RUNNER_TEMP/COVI-ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Clear dict' "$OPTIONS" 2>/dev/null || true
          cat > "$OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict>
            <key>$APP_BUNDLE_ID</key><string>$COVI_PROFILE_NAME</string>
          </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/COVI.xcarchive" \
            -exportPath "$RUNNER_TEMP/COVI-export" \
            -exportOptionsPlist "$OPTIONS"
      - name: Validate and upload to TestFlight (not App Review)
        run: |
          IPA="$(find "$RUNNER_TEMP/COVI-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: COVI-iOS-Signed-IPA
          path: ${{ runner.temp }}/COVI-export/*.ipa
          if-no-files-found: error
          retention-days: 7
