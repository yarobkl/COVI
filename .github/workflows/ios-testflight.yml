name: COVI iOS - Native TestFlight (manual, signed)

# The retired Capacitor target is never built by this workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Native TestFlight version (newer than current 1.0.10)'
        required: true
        default: '1.0.11'
      buildNumber:
        description: 'Minimum App Store Connect build number'
        required: true
        default: '10042'
      uploadToTestFlight:
        description: 'Explicitly archive, sign and upload the native iOS app'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: covi-native-ios-testflight
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: macos-26
    timeout-minutes: 70
    env:
      APP_BUNDLE_ID: com.covi.app
      CLOUDKIT_CONTAINER_ID: iCloud.com.covi.app
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify native source and existing signing credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != 'feature/covi-native-swiftui-cloud' ]]; then
            echo '::error::Only the approved SwiftUI COVI branch can be distributed.'
            exit 1
          fi
          test -f native-ios/project.yml
          test -f native-ios/COVI/Sync/CloudKitSchemaContract.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.covi.app' native-ios/Config/Local.xcconfig
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY CERTIFICATE_P12 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing existing signing secret: $name"
              exit 1
            fi
          done
          test "$APPLE_TEAM_ID" = 'UK4UQCQ57G' || {
            echo '::error::Apple team does not match COVI.'
            exit 1
          }
          echo "Native source revision: $(git rev-parse HEAD)"

      - name: Check existing distribution profile capabilities
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/COVI.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/COVI-profile.plist"
          python3 - "$RUNNER_TEMP/COVI-profile.plist" "$APPLE_TEAM_ID" "$APP_BUNDLE_ID" "$CLOUDKIT_CONTAINER_ID" <<'PY'
          import datetime
          import plistlib
          import sys

          path, team, bundle, container = sys.argv[1:]
          with open(path, 'rb') as f:
              profile = plistlib.load(f)
          entitlements = profile.get('Entitlements', {})
          checks = {
              'App Store bundle ID': entitlements.get('application-identifier') == f'{team}.{bundle}',
              'Apple team': team in profile.get('TeamIdentifier', []),
              'CloudKit container': container in entitlements.get('com.apple.developer.icloud-container-identifiers', []),
              'CloudKit service': 'CloudKit' in entitlements.get('com.apple.developer.icloud-services', []),
              'Production CloudKit': entitlements.get('com.apple.developer.icloud-container-environment') == 'Production',
              'Sign in with Apple': 'Default' in entitlements.get('com.apple.developer.applesignin', []),
              'App Store distribution': not entitlements.get('get-task-allow', True) and 'ProvisionedDevices' not in profile,
              'Profile not expired': profile.get('ExpirationDate', datetime.datetime.min) > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None),
          }
          for label, valid in checks.items():
              print(f'{label}: {"OK" if valid else "INCOMPATIBLE"}')
          if not all(checks.values()):
              sys.exit('The existing profile is incompatible. No Apple certificate or profile was changed.')
          PY

      - name: Generate native Xcode project
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Run native XCTest on iPhone simulator
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and "iPhone" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          if [[ -z "$DEVICE_ID" ]]; then
            echo '::error::No iPhone simulator is available.'
            exit 1
          fi
          xcodebuild test -project COVI.xcodeproj -scheme COVI \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Select unique TestFlight version and build number
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        env:
          MARKETING_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |
          set -euo pipefail
          [[ "$MARKETING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$REQUESTED_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          IFS='.' read -r MAJOR MINOR PATCH <<< "$MARKETING_VERSION"
          if (( 10#$MAJOR < 1 || (10#$MAJOR == 1 && 10#$MINOR == 0 && 10#$PATCH < 11) )); then
            echo '::error::Version must supersede the latest visible TestFlight 1.0.10.'
            exit 1
          fi
          AUTOMATIC_BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          if (( REQUESTED_BUILD_NUMBER > AUTOMATIC_BUILD_NUMBER )); then
            AUTOMATIC_BUILD_NUMBER="$REQUESTED_BUILD_NUMBER"
          fi
          echo "COVI_BUILD_NUMBER=$AUTOMATIC_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "COVI_MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "Native TestFlight: $MARKETING_VERSION ($AUTOMATIC_BUILD_NUMBER)"

      - name: Import existing Apple Distribution certificate
        if: ${{ inputs.uploadToTestFlight == true }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Install previously verified profile on temporary runner
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/COVI.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/COVI-profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/COVI-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "COVI_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Install existing App Store Connect API key on temporary runner
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$ASC_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY"
          fi
          chmod 600 "$KEY"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$KEY"

      - name: Archive signed native application
        if: ${{ inputs.uploadToTestFlight == true }}
        working-directory: native-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project COVI.xcodeproj -scheme COVI \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/COVI.xcarchive" \
            MARKETING_VERSION="$COVI_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$COVI_BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$COVI_PROFILE_NAME"

      - name: Verify archive identity and production entitlements
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/COVI.xcarchive/Products/Applications/COVI.app"
          PLIST="$APP/Info.plist"
          test -f "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$COVI_BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$COVI_MARKETING_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$PLIST")" = 'false'
          codesign --verify --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/COVI-entitlements.plist" 2>/dev/null
          python3 - "$RUNNER_TEMP/COVI-entitlements.plist" "$CLOUDKIT_CONTAINER_ID" <<'PY'
          import plistlib
          import sys
          with open(sys.argv[1], 'rb') as f:
              entitlements = plistlib.load(f)
          if sys.argv[2] not in entitlements.get('com.apple.developer.icloud-container-identifiers', []):
              sys.exit('Archive lacks COVI CloudKit container entitlement.')
          if 'CloudKit' not in entitlements.get('com.apple.developer.icloud-services', []):
              sys.exit('Archive lacks the CloudKit service entitlement.')
          if 'Default' not in entitlements.get('com.apple.developer.applesignin', []):
              sys.exit('Archive lacks Sign in with Apple entitlement.')
          if entitlements.get('com.apple.developer.icloud-container-environment') != 'Production':
              sys.exit('Archive is not signed for CloudKit Production.')
          PY

      - name: Export signed IPA
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/COVI-ExportOptions.plist" "$APPLE_TEAM_ID" "$APP_BUNDLE_ID" "$COVI_PROFILE_NAME" <<'PY'
          import plistlib
          import sys
          path, team, bundle, profile = sys.argv[1:]
          with open(path, 'wb') as f:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'manual',
                             'teamID': team, 'signingCertificate': 'Apple Distribution',
                             'provisioningProfiles': {bundle: profile}}, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/COVI.xcarchive" \
            -exportPath "$RUNNER_TEMP/COVI-export" \
            -exportOptionsPlist "$RUNNER_TEMP/COVI-ExportOptions.plist"

      - name: Upload to internal TestFlight processing only
        if: ${{ inputs.uploadToTestFlight == true }}
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find "$RUNNER_TEMP/COVI-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -f "$IPA"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
