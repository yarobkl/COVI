name: Format kitchen alert (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/features/restaurant/RestaurantStaffApp.tsx src/features/restaurant/RestaurantStaffAudit.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/restaurant/RestaurantStaffApp.tsx src/features/restaurant/RestaurantStaffAudit.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(restaurant): formater les alertes cuisine et le journal"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
