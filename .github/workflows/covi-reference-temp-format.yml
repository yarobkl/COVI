name: COVI optional-reference formatter temporary
on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-stock-central-omnichannel
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository pinned Prettier
        run: |
          npx --no-install prettier --write \
            src/features/checkout/PrivateOrderReferenceImage.tsx \
            src/features/checkout/PublicOrderRequestPage.tsx \
            src/features/checkout/PublicOrderInbox.tsx \
            src/lib/orderReferencePhoto.ts \
            src/lib/publicOrders.ts \
            tests/public-checkout-gateway.test.mjs
      - name: Commit formatting only if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/checkout/PrivateOrderReferenceImage.tsx src/features/checkout/PublicOrderRequestPage.tsx src/features/checkout/PublicOrderInbox.tsx src/lib/orderReferencePhoto.ts src/lib/publicOrders.ts tests/public-checkout-gateway.test.mjs
          git commit -m "style(caisse): apply pinned format to optional client screenshot feature"
          git push origin HEAD:feature/covi-stock-central-omnichannel
