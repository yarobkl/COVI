name: Format production-derived gateway tests once
on:
  push:
    branches:
      - security/covi-gateway-prod-compatible-2026-10-18
    paths:
      - '.github/workflows/covi-prod-gateway-format-once.yml'
permissions:
  contents: write
jobs:
  security-format:
    if: github.repository == 'yarobkl/COVI' && github.ref == 'refs/heads/security/covi-gateway-prod-compatible-2026-10-18'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format the reviewed gateway regression tests only
        run: npx prettier --write tests/public-checkout-gateway.test.mjs
      - name: Verify formatting, lint and test suite
        run: |
          npm run format:check
          npm run lint
          npm test
      - name: Commit only the test formatting to the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/public-checkout-gateway.test.mjs
          if git diff --cached --quiet; then
            echo 'No formatting changes'
          else
            git commit -m 'style(security): format production gateway regression tests'
            git push origin HEAD:refs/heads/security/covi-gateway-prod-compatible-2026-10-18
          fi
