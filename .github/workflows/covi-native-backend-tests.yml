name: COVI Native Backend Authority Tests
on:
  push:
    branches: [feature/covi-2-native]
    paths:
      - 'native-ios/backend/**'
      - '.github/workflows/covi-native-backend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: covi-disposable-test
          POSTGRES_DB: covi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: covi-disposable-test
      PGDATABASE: covi_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify the native team HTTP gateway
        run: |
          node --test native-ios/backend/tests/team_gateway_http.test.mjs
          cd native-ios/backend/functions/covi-native-team
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes deno@2.6.0 check --node-modules-dir=manual index.ts
      - name: Validate isolated native authority without any hosted project
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/migrations/20261125220000_team_authority.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/migrations/20261127152713_native_team_invitations.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/migrations/20261127175600_native_team_directory.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/migrations/20261127182500_native_team_gateway_role.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/tests/team_authority.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/tests/team_invitations.sql
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/tests/team_gateway.sql
      - name: Exercise the HTTP gateway with the restricted PostgreSQL login
        env:
          COVI_TEAM_TEST_DATABASE_URL: postgres://covi_http_test_login:covi-http-disposable-only@localhost:5432/covi_test
        run: |
          psql -v ON_ERROR_STOP=1 -f native-ios/backend/tests/team_gateway_http_integration.sql
          cd native-ios/backend/functions/covi-native-team
          npx --yes deno@2.6.0 test --node-modules-dir=manual --allow-env --allow-net=localhost:5432 integration.test.ts
      - name: Check establishment creation and invitation use across two PostgreSQL connections
        run: python3 native-ios/backend/tests/concurrent_limit.py
