name: Format finance and mission drafts (temporary)
on:
  push:
    branches:
      - feature/covi-multisector-live-base
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-multisector-live-base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format audited changes
        run: npx prettier --write docs/PLAN-COVI-MULTISECTOR-2026-10-17.md docs/AUDIT-FIABILITE-FINANCIERE-ET-ISOLATION-2026-10-17.md src/features/statistics/ArrivalProfitRow.tsx src/features/arrivals/ArrivalCard.tsx src/features/auth/AuthPage.tsx src/features/dashboard/DashboardPage.tsx src/features/dashboard/DashboardPage.test.tsx
      - name: Commit on draft branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN-COVI-MULTISECTOR-2026-10-17.md docs/AUDIT-FIABILITE-FINANCIERE-ET-ISOLATION-2026-10-17.md src/features/statistics/ArrivalProfitRow.tsx src/features/arrivals/ArrivalCard.tsx src/features/auth/AuthPage.tsx src/features/dashboard/DashboardPage.tsx src/features/dashboard/DashboardPage.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: normaliser les fichiers COVI audités"
            git push origin HEAD:feature/covi-multisector-live-base
          fi
