name: COVI QR catalog formatting (one shot)
on:
  push:
    branches:
      - claude/caisse-multi-caissiers
    paths:
      - .github/workflows/covi-qr-prettier-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format updated public catalog files
        run: npx prettier --write src/features/orders/PublicOrderPage.tsx src/features/orders/PublicOrderPage.test.tsx
      - name: Save the formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/orders/PublicOrderPage.tsx src/features/orders/PublicOrderPage.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(QR): format catalog fallback and tests"
            git push origin HEAD:claude/caisse-multi-caissiers
          fi
