name: COVI checkout formatting - temporary
on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-stock-central-omnichannel
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx --no-install prettier --write src/features/checkout/PublicOrderInbox.test.tsx src/features/checkout/PublicOrderInbox.tsx src/features/checkout/PublicOrderRequestPage.tsx
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/checkout/PublicOrderInbox.test.tsx src/features/checkout/PublicOrderInbox.tsx src/features/checkout/PublicOrderRequestPage.tsx
          git commit -m "style(caisse): format realtime and guest payment flow"
          git push origin HEAD:feature/covi-stock-central-omnichannel
