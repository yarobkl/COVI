name: COVI Native iOS Diagnostics
on:
  push:
    branches:
      - feature/covi-native-swiftui-cloud
      - feature/covi-2-native
      - wip/covi-native-20261119-no-testflight
    paths:
      - 'native-ios/**'
      - '.github/workflows/covi-native-diagnostics.yml'
  workflow_dispatch:
jobs:
  interaction:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify the real floor controls with XCUITest
        working-directory: native-ios
        run: |
          set -euo pipefail
          xcodegen generate
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and "iPhone" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          test -n "$DEVICE_ID"
          xcodebuild test -project COVI.xcodeproj -scheme COVIInteraction -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
  diagnose:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Show schemes
        working-directory: native-ios
        run: xcodebuild -list -project COVI.xcodeproj
      - name: Compile app and unit tests
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project COVI.xcodeproj -scheme COVI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Run XCTest on simulator
        working-directory: native-ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and "iPhone" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$DEVICE_ID" ]; then echo "No available iPhone simulator"; exit 1; fi
          xcodebuild test -project COVI.xcodeproj -scheme COVI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO
      - name: Compile Release for simulator without signing
        working-directory: native-ios
        run: |
          set -o pipefail
          xcodebuild build -project COVI.xcodeproj -scheme COVI -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Capture real iPhone components with isolated fixtures
        timeout-minutes: 18
        working-directory: native-ios
        run: |
          set -euo pipefail
          # A stalled Simulator command must not hide all earlier screenshots.
          run_bounded() {
            python3 - "$@" <<'PYTIMEOUT'
          import subprocess, sys
          try:
              subprocess.run(sys.argv[1:], check=True, timeout=120)
          except subprocess.TimeoutExpired:
              print('Simulator command timed out after 120 seconds: ' + ' '.join(sys.argv[1:]), flush=True)
              sys.exit(124)
          except subprocess.CalledProcessError as error:
              sys.exit(error.returncode)
          PYTIMEOUT
          }
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and "iPhone" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          if [ -z "$DEVICE_ID" ]; then echo "No available iPhone simulator"; exit 1; fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          run_bounded xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/COVI.app' -type d -print -quit)
          if [ -z "$APP_PATH" ]; then echo "COVI Debug simulator app not found"; exit 1; fi
          run_bounded xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.covi.app data)
          CAPTURE_DIR="$RUNNER_TEMP/COVI-visual-diagnostics"
          mkdir -p "$CAPTURE_DIR"
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --batteryState charged --batteryLevel 100
          trap 'xcrun simctl status_bar "$DEVICE_ID" clear' EXIT
          # Give the newest diagnostic an opportunity to render before the regression sweep.
          for SCENARIO in restaurant-floor-order-start restaurant-floor-checkout restaurant-floor-checkout-sheet boutique-category shop-header salon-report-absences salon-clients-absences salon-report account-login account-registration sync-centre cashier-pin establishment-setup spaces restaurant-order-drinks salon-agenda salon-agenda-grid boutique-photo-search restaurant-incident restaurant-kitchen restaurant-kitchen-ready restaurant-paid-table restaurant-floor-guests restaurant-floor-zoom boutique-arrivals restaurant-floor-terrace restaurant-floor-plan restaurant-floor-edit restaurant-payment restaurant-drinks restaurant-menu restaurant-team restaurant-report salon-more salon-settings salon-checkout salon-catalog welcome boutique-home boutique-sale boutique-checkout restaurant-tables restaurant-table restaurant-order salon-today salon-booking salon-booking-conflict salon-clients salon-clients-upcoming salon-profile; do
            MARKER="$APP_DATA/tmp/covi-diagnostic-$SCENARIO.ready"
            rm -f "$MARKER"
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.covi.app --covi-diagnostic-scenario "$SCENARIO" -AppleLanguages '(fr)' -AppleLocale fr_FR
            for ATTEMPT in {1..20}; do
              if [ -f "$MARKER" ]; then break; fi
              sleep 1
            done
            if [ ! -f "$MARKER" ] || [ "$(cat "$MARKER")" != "$SCENARIO" ]; then
              echo "Diagnostic scenario did not become ready: $SCENARIO"
              exit 1
            fi
            run_bounded xcrun simctl io "$DEVICE_ID" screenshot "$CAPTURE_DIR/$SCENARIO.png"
          done
          # Validate the same native views with iPhone accessibility text.
          run_bounded xcrun simctl ui "$DEVICE_ID" content_size accessibility-extra-extra-extra-large
          for SCENARIO in restaurant-floor-checkout boutique-category shop-header salon-report-absences salon-clients-absences salon-report account-login account-registration sync-centre cashier-pin establishment-setup spaces restaurant-order-drinks salon-profile boutique-home salon-agenda restaurant-kitchen restaurant-drinks salon-checkout salon-catalog; do
            MARKER="$APP_DATA/tmp/covi-diagnostic-$SCENARIO.ready"
            rm -f "$MARKER"
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" com.covi.app --covi-diagnostic-scenario "$SCENARIO" -AppleLanguages '(fr)' -AppleLocale fr_FR
            for ATTEMPT in {1..20}; do
              if [ -f "$MARKER" ]; then break; fi
              sleep 1
            done
            test "$(cat "$MARKER")" = "$SCENARIO"
            run_bounded xcrun simctl io "$DEVICE_ID" screenshot "$CAPTURE_DIR/$SCENARIO-accessibility-xxxl.png"
          done
          run_bounded xcrun simctl ui "$DEVICE_ID" content_size large
          echo "COVI_DIAGNOSTIC_IPHONE=$DEVICE_ID" >> "$GITHUB_ENV"
          printf '%s\n' \
            "Debug iPhone simulator; synthetic data stored in memory only; no network or TestFlight upload." \
            "welcome: actual RootView with an empty in-memory session." \
            "account-login/registration: actual welcome navigation destinations with an anonymous local fixture and native Apple control." \
            "spaces: actual COVISpaces with two owned establishments, one active collaboration and one revoked access." \
            "shop-header: real RootView and tabs with an isolated local owner and Vendre selected." \
            "establishment-setup: actual RootView with a local test identity, no shops and a prefilled native creation form." \
            "cashier-pin: actual DynamicTabView with an active cashier and the native PIN sheet, two synthetic digits entered." \
            "sync-centre: actual Plus destination with four synthetic transfer statuses, one local business journal entry and an excluded second shop." \
            "boutique-home: BoutiqueSpace with two completed in-memory sales (cash and Airtel Money), and low stock." \
            "boutique-photo-search: actual Vision search using an isolated synthetic photo and a preselected catalog candidate." \
            "boutique-sale/checkout: actual DynamicTabView, BoutiqueSpace and Checkout." \
            "restaurant-tables: actual DynamicTabView and RestaurantSpace with four in-memory tables." \
            "restaurant-table/order: actual RestaurantTable and RestaurantComposer using saved in-memory lines and an unsent draft." \
            "restaurant-order-drinks: actual RestaurantComposer with two available units, one exhausted drink and an untracked drink. The stale draft blocks sending." \
            "salon-today/agenda/agenda-grid: actual Salon day list and staff planning with three staff members and four in-memory appointments." \
            "salon-booking and salon-booking-conflict: actual Agenda sheet with a prefilled appointment and an overlapping stylist appointment in the conflict scenario." \
            "salon-clients/profile: actual directory and client page with four clients, three receipts, one upcoming appointment and two recorded absences in memory." \
            "salon-report/absences: actual report and absence detail with four receipts and one absence recorded by SalonLedger in memory." \
            "salon-more/settings: normal Plus tab and settings route with a local synthetic owner and two in-memory establishments." \
            "restaurant-report: actual Plus destination with synthetic receipts, a recorded refund and a locally saved incident." \
            "restaurant-team: Plus team screen with a local test owner, three enabled members and one inactive membership." \
            "restaurant-incident: actual incident form opened from an in-memory served line, with a draft reason." \
            "restaurant-kitchen/kitchen-ready: actual Kitchen tabs with a twelve-minute unclaimed ticket, a claimed ticket and a ready ticket." \
            "restaurant-menu: actual Plus destination with grouped dishes, a drink and a sold-out item in memory." \
            "restaurant-paid-table: actual Table 01 after a confirmed cash settlement, waiting for physical departure." \
            "restaurant-floor-guests: actual floor summary with two covers explicitly recorded for a three-seat table." \
            "restaurant-floor-zoom: actual floor viewport set to 150 percent, room selector still visible." \
            "restaurant-floor-terrace: real room selector showing only its two assigned tables and their live statuses." \
            "restaurant-floor-plan/floor-edit: real Salle and position editor, eight in-memory tables, Table 10 moved to column 3, Table 6 turned 90 degrees." \
            "restaurant-payment: actual Table checkout sheet with a 28500 XAF bill and 15000 XAF entered but unconfirmed." \
            "restaurant-drinks: actual Plus destination with four balances, recorded reservations and a journaled service deduction." \
            "Account header and ShopSyncStatus are outside the business captures." \
            "Basket: 18,000 + 17,000 XAF; cash received: 40,000 XAF; change: 5,000 XAF." \
            "Restaurant drinks and Salon checkout/catalog include iPhone accessibility XXXL. The iPad step records separate proof; physical devices, interaction and cross-account sync remain unverified." \
            > "$CAPTURE_DIR/capture-notes.txt"
      - name: Capture Salon checkout and catalog on iPad
        if: success()
        timeout-minutes: 12
        working-directory: native-ios
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$COVI_DIAGNOSTIC_IPHONE" || true
          IPAD_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and "iPad" in d["name"]]; print(devices[0]["udid"] if devices else "")')
          test -n "$IPAD_ID"
          wait_for_ipad() {
            python3 -c '
          import subprocess, sys
          try:
              subprocess.run(["xcrun", "simctl", "bootstatus", sys.argv[1], "-b"], check=True, timeout=180)
          except subprocess.TimeoutExpired:
              print("iPad boot did not complete in 180 seconds.", flush=True)
              sys.exit(124)
          except subprocess.CalledProcessError as error:
              sys.exit(error.returncode)
          ' "$IPAD_ID"
          }
          xcrun simctl boot "$IPAD_ID" 2>/dev/null || true
          if ! wait_for_ipad; then
            xcrun simctl shutdown "$IPAD_ID" || true
            xcrun simctl boot "$IPAD_ID" 2>/dev/null || true
            wait_for_ipad
          fi
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/COVI.app' -type d -print -quit)
          test -n "$APP_PATH"
          xcrun simctl install "$IPAD_ID" "$APP_PATH"
          IPAD_DATA=$(xcrun simctl get_app_container "$IPAD_ID" com.covi.app data)
          CAPTURE_DIR="$RUNNER_TEMP/COVI-visual-diagnostics"
          for SCENARIO in salon-checkout salon-catalog; do
            MARKER="$IPAD_DATA/tmp/covi-diagnostic-$SCENARIO.ready"
            rm -f "$MARKER"
            xcrun simctl launch --terminate-running-process "$IPAD_ID" com.covi.app --covi-diagnostic-scenario "$SCENARIO" -AppleLanguages '(fr)' -AppleLocale fr_FR
            for ATTEMPT in {1..20}; do
              if [ -f "$MARKER" ]; then break; fi
              sleep 1
            done
            if [ ! -f "$MARKER" ] || [ "$(cat "$MARKER")" != "$SCENARIO" ]; then
              echo "iPad diagnostic scenario did not become ready: $SCENARIO"
              exit 1
            fi
            xcrun simctl io "$IPAD_ID" screenshot "$CAPTURE_DIR/$SCENARIO-iPad.png"
          done
          printf '%s\n' "iPad simulator: Caisse and Catalogue Salon both captured." >> "$CAPTURE_DIR/capture-notes.txt"
      - name: Save simulator visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: COVI-visual-diagnostics-iPhone
          path: ${{ runner.temp }}/COVI-visual-diagnostics/
          if-no-files-found: error
          retention-days: 14

