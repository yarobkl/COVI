name: COVI payment reference formatting (one shot)
on:
  push:
    branches:
      - claude/caisse-multi-caissiers
    paths:
      - .github/workflows/covi-payment-ref-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format payment reference changes
        run: npx prettier --write src/features/orders/OrdersInbox.tsx src/features/sale/cartSubmit.ts src/features/sale/SaleDone.tsx src/lib/operationReference.test.ts
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/orders/OrdersInbox.tsx src/features/sale/cartSubmit.ts src/features/sale/SaleDone.tsx src/lib/operationReference.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(payments): format operation reference screens and tests"
            git push origin HEAD:claude/caisse-multi-caissiers
          fi
