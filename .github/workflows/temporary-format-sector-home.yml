name: Temporary formatter — restaurant home branch
on:
  push:
    branches:
      - feature/covi-restaurant-home-guide-20261018
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the restaurant welcome changes
        run: |
          npx prettier --write src/features/sectors/SectorHomePage.tsx src/features/sectors/SectorHomePage.test.tsx
          git --no-pager diff -- src/features/sectors/SectorHomePage.tsx src/features/sectors/SectorHomePage.test.tsx
      - name: Commit formatting on the feature branch only
        run: |
          if ! git diff --quiet -- src/features/sectors/SectorHomePage.tsx src/features/sectors/SectorHomePage.test.tsx; then
            git config user.name "COVI format bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/sectors/SectorHomePage.tsx src/features/sectors/SectorHomePage.test.tsx
            git commit -m "style: apply Prettier to restaurant guide [format bot]"
            git push origin HEAD:feature/covi-restaurant-home-guide-20261018
          fi
