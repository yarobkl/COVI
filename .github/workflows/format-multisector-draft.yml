name: Format multisector branch (temporary)
on:
  push:
    branches:
      - feature/covi-multisector-staff-foundation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-multisector-staff-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply repo Prettier formatting
        run: |
          npx prettier --write docs/PLAN-COVI-MULTISECTOR-2026-10-17.md src/app/routes.ts src/features/settings/SettingsPage.tsx src/features/staff/EmployeesPage.tsx
      - name: Commit formatting (no production branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN-COVI-MULTISECTOR-2026-10-17.md src/app/routes.ts src/features/settings/SettingsPage.tsx src/features/staff/EmployeesPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to multisector draft"
            git push origin HEAD:feature/covi-multisector-staff-foundation
          fi
