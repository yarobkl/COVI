name: COVI iOS native compile (no distribution)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-native-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare iOS app
        run: |
          npm ci
          npm run ios:sync
      - name: Compile for iOS simulator without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/COVI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/covi-xcodebuild.log"
      - name: Verify compiled simulator application
        run: |
          test -d "$RUNNER_TEMP/COVI-DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          echo "iOS simulator app compiled successfully. No signing or distribution performed."
