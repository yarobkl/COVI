name: Format COVI Connect once
on:
  push:
    branches: [feature/covi-connect-websites-20261019]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-connect-websites-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply Prettier to new and changed files
        run: npx prettier --write docs/covi-connect.md src/app/App.tsx src/features/orders/WebsiteConnectPanel.tsx src/lib/websiteConnect.ts tests/covi-connect-gateway.test.mjs
      - name: Commit and remove this one-shot workflow
        run: |
          rm .github/workflows/covi-connect-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/covi-connect.md src/app/App.tsx src/features/orders/WebsiteConnectPanel.tsx src/lib/websiteConnect.ts tests/covi-connect-gateway.test.mjs .github/workflows/covi-connect-format-once.yml
          git diff --cached --quiet || (git commit -m "style(connect): format API and UI" && git push)
