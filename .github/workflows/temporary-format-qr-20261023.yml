name: Temporary QR formatter
on:
  push:
    branches: [feature/covi-restaurant-qr-room-20261023]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[qr format bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/restaurant/RestaurantTablesPage.tsx src/styles/app/pages.css
      - run: |
          if ! git diff --quiet; then
            git config user.name "COVI format bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/restaurant/RestaurantTablesPage.tsx src/styles/app/pages.css
            git commit -m "style(restaurant): format QR and floor grid [qr format bot]"
            git push origin HEAD:feature/covi-restaurant-qr-room-20261023
          fi
