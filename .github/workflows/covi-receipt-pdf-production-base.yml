name: COVI receipt PDF integration - production branch
on:
  push:
    branches:
      - feature/covi-recu-pdf-partage-production
  pull_request:
    branches:
      - claude/caisse-multi-caissiers

permissions:
  contents: read

jobs:
  receipt-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Verify TypeScript and built production bundle
        run: |
          npm run typecheck
          npm run build
      - name: Verify cashier, multi-line cart, native share and offline guards
        run: npm test

  pdf-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure PDF parser and renderer
        run: command -v pdfinfo && command -v pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Generate PDFs with local, synthetic receipt data only
        run: node --experimental-strip-types tests/render-receipt-pdf.mjs "$RUNNER_TEMP/covi-pdfs"
      - name: Validate structure, text and rendered page
        run: |
          set -euo pipefail
          pdfinfo "$RUNNER_TEMP/covi-pdfs/covi-recu-exemple.pdf" | grep -q "Pages: *1"
          pdfinfo "$RUNNER_TEMP/covi-pdfs/covi-recu-multipage.pdf" | grep -E "Pages: *[2-9]"
          pdftotext -layout "$RUNNER_TEMP/covi-pdfs/covi-recu-exemple.pdf" - | grep -q "YARO BOUTIQUE"
          pdftotext -layout "$RUNNER_TEMP/covi-pdfs/covi-recu-exemple.pdf" - | grep -q "COVI-489A49"
          pdftoppm -f 1 -l 1 -r 110 -png -singlefile \
            "$RUNNER_TEMP/covi-pdfs/covi-recu-exemple.pdf" \
            "$RUNNER_TEMP/covi-pdfs/covi-render"
          test -s "$RUNNER_TEMP/covi-pdfs/covi-render.png"
