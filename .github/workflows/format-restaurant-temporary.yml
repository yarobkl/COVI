name: Format restaurant draft (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/features/restaurant/RestaurantOrdersPage.tsx src/lib/database.types.ts src/app/sectorNavigation.ts src/app/App.tsx src/app/App.test.tsx src/app/navigation.ts src/app/routes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          if ! git diff --cached --quiet; then
            git commit -m "style: formater le moteur restaurant"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
