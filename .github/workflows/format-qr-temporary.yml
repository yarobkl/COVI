name: Format QR draft (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/lib/restaurantQr.ts src/lib/restaurantQr.test.ts src/features/restaurant/PublicRestaurantTablePage.tsx src/app/Root.tsx tests/restaurant-qr-gateway.test.mjs supabase/functions/restaurant-qr/gateway.mjs supabase/functions/restaurant-qr/index.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ tests/restaurant-qr-gateway.test.mjs supabase/functions/restaurant-qr/
          if ! git diff --cached --quiet; then
            git commit -m "style: normaliser le portail QR Restaurant"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
