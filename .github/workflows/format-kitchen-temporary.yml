name: Normalize kitchen draft (temporary)
on:
  push:
    branches:
      - feature/covi-restaurant-salon-v1
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-restaurant-salon-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/lib/kitchenInbox.ts src/lib/kitchenInbox.test.ts src/lib/kitchenBrowserNotifications.ts src/features/restaurant/RestaurantKitchenInbox.tsx src/features/restaurant/RestaurantStaffApp.tsx src/lib/database.types.ts public/restaurant-kitchen-worker.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/kitchenInbox.ts src/lib/kitchenInbox.test.ts src/lib/kitchenBrowserNotifications.ts src/features/restaurant/RestaurantKitchenInbox.tsx src/features/restaurant/RestaurantStaffApp.tsx src/lib/database.types.ts public/restaurant-kitchen-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "style(cuisine): normaliser file durable et alertes navigateur"
            git push origin HEAD:feature/covi-restaurant-salon-v1
          fi
