# Temporaire : formate uniquement les 4 nouveaux fichiers. A supprimer dès réussite.
name: COVI Assistant temporary formatter
on:
  push:
    branches: [feature/covi-assistant-gemini-v1]
permissions:
  contents: write
jobs:
  format-four-files:
    if: github.repository == 'yarobkl/COVI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier targeted
        run: npx prettier --write docs/COVI-ASSISTANT-GEMINI-V1.md src/features/assistant/AssistantPage.test.tsx src/features/assistant/AssistantPage.tsx tests/covi-assistant-handler.test.mjs
      - name: Commit only formatting if changed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "COVI format bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/COVI-ASSISTANT-GEMINI-V1.md src/features/assistant/AssistantPage.test.tsx src/features/assistant/AssistantPage.tsx tests/covi-assistant-handler.test.mjs
            git commit -m "style(ai): format Gemini assistant proposal"
            git push origin HEAD:feature/covi-assistant-gemini-v1
          fi
