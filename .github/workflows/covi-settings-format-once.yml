name: COVI settings one-time formatting
on:
  push:
    branches:
      - fix/covi-settings-central-africa-location-selector
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/covi-settings-central-africa-location-selector
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier formatter
        run: npx --no-install prettier --write src/features/settings/SettingsPage.tsx
      - name: Commit only actual formatting changes
        run: |
          if git diff --quiet; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/SettingsPage.tsx
          git commit -m "style(settings): format country and city selectors"
          git push origin HEAD:fix/covi-settings-central-africa-location-selector
