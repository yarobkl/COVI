name: Format COVI Connect App once
on:
  push:
    branches: [feature/covi-connect-websites-20261019]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-connect-websites-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx prettier --write src/app/App.tsx
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/covi-connect-format-app-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx .github/workflows/covi-connect-format-app-once.yml
          git diff --cached --quiet || (git commit -m "style(connect): format App routes" && git push)
