name: COVI Chat PIN-less formatter
on:
  push:
    branches: [feature/covi-assistant-no-chat-pin]
permissions:
  contents: write
jobs:
  format-chat-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write docs/COVI-CHAT-SANS-PIN.md src/features/assistant/AssistantPage.test.tsx tests/covi-assistant-handler.check.mjs
      - shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "COVI format bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/COVI-CHAT-SANS-PIN.md src/features/assistant/AssistantPage.test.tsx tests/covi-assistant-handler.check.mjs
            git commit -m "style(ai): format PIN-less assistant tests"
            git push origin HEAD:feature/covi-assistant-no-chat-pin
          fi
