name: COVI gateway audit format (one-time)

on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
    paths:
      - '.github/workflows/covi-gateway-audit-format.yml'

permissions:
  contents: write

jobs:
  format-gateway-tests:
    if: github.repository == 'yarobkl/COVI' && github.ref == 'refs/heads/feature/covi-stock-central-omnichannel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only the gateway security tests
        run: npx prettier --write tests/public-checkout-gateway.test.mjs
      - name: Verify branch formatting and security tests
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Commit to experimental branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/public-checkout-gateway.test.mjs
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(security): format token-rotation regression tests'
            git push origin HEAD:refs/heads/feature/covi-stock-central-omnichannel
          fi
