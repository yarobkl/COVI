name: Format staff UI in draft (temporary)
on:
  push:
    branches:
      - feature/covi-multisector-live-base
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-multisector-live-base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/features/staff/EmployeesPage.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/staff/EmployeesPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(staff): format page"
            git push origin HEAD:feature/covi-multisector-live-base
          fi
