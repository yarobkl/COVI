name: COVI isolated branch checks

on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and offline tests
        run: npm test
      - name: Lint
        run: npm run lint
