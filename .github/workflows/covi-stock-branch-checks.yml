name: COVI isolated branch checks

on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard against accidental SQL migrations
        run: node tests/sql-draft-safety.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and offline tests
        run: npm test
      - name: Lint
        run: npm run lint

  postgres-checkout-smoke:
    name: Disposable PostgreSQL checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Run migrations and owner-only checkout tests in disposable DB
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: covi_ci
          PGPASSWORD: postgres
        run: bash tests/run-postgres-checkout.sh

  safe-branch-format-and-qr-dependency:
    name: Isolated branch formatting and local QR dependency
    if: github.event_name == 'push' && github.repository == 'yarobkl/COVI' && github.ref == 'refs/heads/feature/covi-stock-central-omnichannel'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install bundled QR SVG dependency
        run: |
          npm install --save-exact qrcode@1.5.4
          npm install --save-dev --save-exact @types/qrcode@1.5.5
      - name: Format checkout branch while preserving ignored OAuth files
        run: npm run format
      - name: Verify branch formatting
        run: npm run format:check
      - name: Commit and push to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'chore(checkout): format isolated branch and add local QR SVG library'
            git push origin HEAD:refs/heads/feature/covi-stock-central-omnichannel
          fi
