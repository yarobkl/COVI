name: COVI isolated branch checks

on:
  push:
    branches:
      - feature/covi-stock-central-omnichannel
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guard against accidental SQL migrations
        run: node tests/sql-draft-safety.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and offline tests
        run: npm test
      - name: Lint
        run: npm run lint

  postgres-checkout-smoke:
    name: Disposable PostgreSQL checkout tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: covi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d covi_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client is available
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Run migrations and owner-only checkout tests in disposable DB
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: covi_ci
          PGPASSWORD: postgres
        run: bash tests/run-postgres-checkout.sh


  format-export-for-review:
    name: Produce reviewed Prettier-only patch (no auth changes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format checkout branch in disposable runner
        run: npm run format
      - name: Emit formatted files for safe manual application to PR
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const paths = execFileSync('git',['diff','--name-only','--diff-filter=M'],{
            encoding:'utf8'
          }).split('\n').filter(Boolean)
          console.log('COVI_FORMAT_COUNT ' + paths.length)
          for(const path of paths) {
            // Never format the existing OAuth/signup forms as part of checkout.
            if(path.startsWith('src/features/auth/')) throw new Error('Unexpected auth file ' + path)
            const payload=JSON.stringify({path,content:readFileSync(path,'utf8')})
            console.log('COVI_FORMAT_BEGIN ' + path)
            for(let i=0;i<payload.length;i+=1600){
              console.log('COVI_FORMAT_PART ' + payload.slice(i,i+1600))
            }
            console.log('COVI_FORMAT_END ' + path)
          }
          NODE
