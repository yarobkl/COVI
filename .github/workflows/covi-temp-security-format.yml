name: COVI temporary secure gateway formatting
on:
  pull_request:
    branches: [claude/caisse-multi-caissiers]
    paths:
      - '.github/workflows/covi-temp-security-format.yml'

permissions:
  contents: write

jobs:
  format-security-only:
    if: ${{ github.event.pull_request.head.repo.full_name == 'yarobkl/COVI' && github.head_ref == 'feature/covi-secure-integration-2026-10' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/covi-secure-integration-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only two security patch files
        run: npx prettier --write src/lib/publicOrders.ts src/lib/publicOrders.test.ts
      - name: Commit only formatting on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/lib/publicOrders.ts src/lib/publicOrders.test.ts
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(security): format gateway fail-closed guard'
            git push origin HEAD:refs/heads/feature/covi-secure-integration-2026-10
          fi
